<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tinteiro · Descubra mangás, manhwas e manhuas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body class="app min-h-screen">
  <header class="app-header sticky top-0 z-30">
    <div class="mx-auto flex max-w-7xl items-center gap-3 px-4 py-3">
      <a href="./" class="logo flex items-center gap-2 font-display text-2xl font-extrabold" aria-label="Tinteiro, página inicial">
        <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2c3.5 4.2 6 7.4 6 10.8A6 6 0 0 1 6 12.8C6 9.4 8.5 6.2 12 2Z"/></svg>
        MangaTo
      </a>

      <form id="search-form" class="relative mx-auto min-w-0 flex-1 sm:max-w-xl" role="search">
        <input id="search-input" class="field w-full" type="search" autocomplete="off"
               placeholder="Buscar um título…" aria-label="Buscar títulos">
      </form>

      <button id="favs-btn" class="btn btn-ghost" type="button">
        Estante <span id="favs-count" class="count">0</span>
      </button>
      <button id="theme-btn" class="icon-btn" type="button" aria-label="Alternar tema claro/escuro">
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
    </div>
  </header>

  <main class="mx-auto grid max-w-7xl gap-10 px-4 py-8 lg:grid-cols-[minmax(0,1fr)_340px]">
    <div class="min-w-0 space-y-12">

      <section class="space-y-5">
        <h1 class="font-display max-w-2xl text-3xl font-extrabold leading-tight sm:text-4xl">
          Encontre a próxima história que você não vai conseguir largar.
        </h1>
        <div id="type-filter" class="flex flex-wrap gap-2" role="group" aria-label="Filtrar por tipo">
          <button class="chip" data-type="" aria-pressed="true">Todos</button>
          <button class="chip" data-type="manga" aria-pressed="false">Mangá</button>
          <button class="chip" data-type="manhwa" aria-pressed="false">Manhwa</button>
          <button class="chip" data-type="manhua" aria-pressed="false">Manhua</button>
        </div>
      </section>

      <!-- Resultados de busca e estante (aparece sob demanda) -->
      <section id="results" hidden aria-live="polite">
        <div class="mb-4 flex items-center justify-between gap-4">
          <h2 id="results-title" class="section-title"></h2>
          <button id="results-close" class="btn btn-ghost" type="button">Fechar</button>
        </div>
        <div id="results-grid" class="grid-cards"></div>
      </section>

      <section aria-labelledby="popular-title">
        <div class="mb-4 flex items-center justify-between">
          <h2 id="popular-title" class="section-title">Em alta agora</h2>
          <div class="flex gap-2">
            <button class="icon-btn" data-scroll="popular-track" data-dir="-1" aria-label="Anterior">‹</button>
            <button class="icon-btn" data-scroll="popular-track" data-dir="1" aria-label="Próximo">›</button>
          </div>
        </div>
        <div id="popular-track" class="carousel" tabindex="0"></div>
      </section>

      <section aria-labelledby="loved-title">
        <div class="mb-4 flex items-center justify-between">
          <h2 id="loved-title" class="section-title">Mais amados pelos leitores</h2>
          <div class="flex gap-2">
            <button class="icon-btn" data-scroll="loved-track" data-dir="-1" aria-label="Anterior">‹</button>
            <button class="icon-btn" data-scroll="loved-track" data-dir="1" aria-label="Próximo">›</button>
          </div>
        </div>
        <div id="loved-track" class="carousel" tabindex="0"></div>
      </section>
    </div>

    <aside class="panel self-start lg:sticky lg:top-24" aria-label="Novidades e séries completas">
      <div class="tabs mb-3 flex gap-5" role="tablist">
        <button role="tab" data-tab="recent" aria-selected="true">Novidades</button>
        <button role="tab" data-tab="complete" aria-selected="false">Completos</button>
      </div>
      <div id="side-list" class="space-y-1"></div>
    </aside>
  </main>

  <footer class="mx-auto max-w-7xl px-4 pb-10 text-sm muted">
    Dados do MyAnimeList, via Jikan API. O MangaTo ajuda a descobrir títulos; não hospeda capítulos.
  </footer>

  <dialog id="detail" aria-labelledby="detail-title">
    <div id="detail-body"></div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
